{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="container ec-fade-in" style="max-width: 640px; padding: 60px 20px;">
  <h1>Contact Us</h1>
  <p style="color: var(--ec-gray); margin-top: 10px;">Have a question? Reach out and we'll get back to you.</p>

  <form class="mt-4" style="margin-top: 24px;">
    <div class="mb-3">
      <label class="ec-form-label">Name</label>
      <input type="text" class="ec-form-control" placeholder="Your name" required>
    </div>
    <div class="mb-3">
      <label class="ec-form-label">Email</label>
      <input type="email" class="ec-form-control" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label class="ec-form-label">Message</label>
      <textarea class="ec-form-control" rows="5" placeholder="How can we help?" required></textarea>
    </div>
    <button type="submit" class="ec-btn ec-btn-primary ec-btn-block">
      <i class="fa-solid fa-paper-plane"></i> Send Message
    </button>
  </form>
</div>
{% endblock %}
