{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="ec-auth-wrapper">
  <div class="ec-auth-card ec-slide-up">
    <div class="text-center mb-4">
      <span style="font-size: 2rem;">🔒</span>
      <h2>Reset Password</h2>
      <p style="color: var(--ec-gray);">Choose a new password for your account.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="mb-3">
        <label class="ec-form-label">New Password</label>
        <input type="password" name="password" class="ec-form-control" required minlength="8" autofocus>
      </div>
      <div class="mb-3">
        <label class="ec-form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="ec-form-control" required minlength="8">
      </div>
      <button type="submit" class="ec-btn ec-btn-primary ec-btn-block">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
