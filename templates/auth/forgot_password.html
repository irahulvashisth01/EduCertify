{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="ec-auth-wrapper">
  <div class="ec-auth-card ec-slide-up">
    <div class="text-center mb-4">
      <span style="font-size: 2rem;">🔑</span>
      <h2>Forgot Password</h2>
      <p style="color: var(--ec-gray);">Enter your email and we'll send you a reset link.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-3">
        <label class="ec-form-label">Email</label>
        <input type="email" name="email" class="ec-form-control" required autofocus>
      </div>
      <button type="submit" class="ec-btn ec-btn-primary ec-btn-block">Send Reset Link</button>
    </form>
    <p class="text-center mt-4" style="color: var(--ec-gray); font-size: 0.9rem;">
      <a href="{{ url_for('auth.login') }}" style="color: var(--ec-blue); font-weight: 600;">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
