{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">{% endblock %}

{% block content %}
<div class="ec-dash-layout">
  {% set active_page = 'profile' %}
  {% include "student/_sidebar.html" %}

  <div class="ec-dash-content ec-fade-in">
    <h2>My Profile</h2>

    <div class="ec-card p-4" style="max-width: 480px;">
      <form method="POST" action="{{ url_for('student.profile') }}">
        <div class="mb-3">
          <label class="ec-form-label">Full Name</label>
          <input type="text" name="full_name" class="ec-form-control" value="{{ user.FullName }}" required minlength="2">
        </div>
        <div class="mb-3">
          <label class="ec-form-label">Email</label>
          <input type="email" class="ec-form-control" value="{{ user.Email }}" disabled>
        </div>
        <div class="mb-3">
          <label class="ec-form-label">Account Type</label>
          <input type="text" class="ec-form-control" value="{{ user.Role }}" disabled>
        </div>
        <button type="submit" class="ec-btn ec-btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>{% endblock %}
