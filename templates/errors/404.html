{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container text-center ec-fade-in" style="padding: 100px 20px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--ec-blue); font-family: var(--ec-font-heading);">404</div>
  <h2 style="margin-top: 10px;">Page Not Found</h2>
  <p style="color: var(--ec-gray); max-width: 480px; margin: 12px auto 28px;">
    The page you're looking for doesn't exist or may have been moved.
  </p>
  <a href="{{ url_for('public.home') }}" class="ec-btn ec-btn-primary">
    <i class="fa-solid fa-house"></i> Back to Home
  </a>
</div>
{% endblock %}
