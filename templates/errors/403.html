{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container text-center ec-fade-in" style="padding: 100px 20px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--ec-warning); font-family: var(--ec-font-heading);">403</div>
  <h2 style="margin-top: 10px;">Access Denied</h2>
  <p style="color: var(--ec-gray); max-width: 480px; margin: 12px auto 28px;">
    You don't have permission to view this page. If you think this is a mistake, contact support.
  </p>
  <a href="{{ url_for('public.home') }}" class="ec-btn ec-btn-primary">
    <i class="fa-solid fa-house"></i> Back to Home
  </a>
</div>
{% endblock %}
